<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гайд Asura BnS</title>
	<meta name="color-scheme" content="light">
    
<style>
		:root {
			color-scheme: light !important;
		}
		/* 1. БАЗОВЫЕ СБРОСЫ И ШРИФТЫ */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background: linear-gradient(135deg, #2a1a3a 0%, #1e1230 100%);
			font-family: 'Segoe UI', 'Noto Sans', sans-serif;
			margin: 0;
			padding: 15px;
			min-height: 100vh;
			display: flex;
			align-items: flex-start;
		}

		/* 2. СТРУКТУРА КОНТЕЙНЕРОВ */
		.guide-container {
			width: 100%;
			background: #2a1e3a;
			border-radius: 24px;
			box-shadow: 0 20px 40px rgba(0,0,0,0.4);
			display: flex;
			gap: 20px;
			padding: 20px;
		}

		.sidebar {
			width: 280px;
			flex-shrink: 0;
			display: flex;
			flex-direction: column;
			gap: 10px;

			position: -webkit-sticky;
			position: sticky;
			top: 15px;
			align-self: flex-start;
			height: fit-content;
		}

		.content-panel {
			flex: 1;
			background: #3d2a52;
			border-radius: 20px;
			padding: 20px;
			min-height: 85vh;
		}

		.content-inner {
			background: #271e34;
			border-radius: 16px;
			padding: 16px 20px;
			box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
			border: 1px solid #5a3e7a;
			min-height: 100%;
		}

		/* 3. КНОПКИ МЕНЮ */
		.section-btn {
			background: linear-gradient(135deg, #3d2a52 0%, #2a1a3a 100%);
			border: none;
			padding: 12px 18px;
			border-radius: 60px;
			font-size: 15px;
			font-weight: 500;
			text-align: left;
			cursor: pointer;
			transition: all 0.2s ease;
			box-shadow: 0 4px 8px rgba(0,0,0,0.2);
			color: #ffcf8a;
			letter-spacing: 1px;
			border-left: 3px solid transparent;
		}

		.section-btn:hover, .section-btn.active {
			transform: translateX(4px);
			background: linear-gradient(135deg, #5a3e7a 0%, #3d2a52 100%);
			border-left: 3px solid #ffb347;
			color: #ffe0a3;
		}

		/* 4. ТИПОГРАФИКА */
		.content-inner h2 {
			color: #ffb347;
			font-size: 26px;
			margin-bottom: 8px;
			padding-bottom: 6px;
			border-bottom: 2px solid #5a3e7a;
			font-weight: 500;
		}

		.content-inner p, .content-inner li {
			color: #f5e6b8;
			line-height: 1.6;
			font-size: 16px;
			margin-bottom: 10px;
		}

		.yellow-text { color: #ffd966; font-weight: bold; }

		/* Стили для кликабельных слов в тексте */
		.content-inner a.yellow-text {
			cursor: pointer;
			transition: color 0.2s;
		}
		.content-inner a.yellow-text:hover {
			color: #ffb347;
		}

		.important {
			background: rgba(255, 179, 71, 0.15);
			border-left: 4px solid #ffb347;
			padding: 10px 14px;
			border-radius: 10px;
			margin: 12px 0;
			color: #ffe0a3;
		}

		/* 5. ИНТЕРАКТИВНЫЕ КАРТИНКИ И СХЕМЫ */
		.schema-wrapper {
			display: flex;
			justify-content: center;
			margin: 20px auto;
			overflow-x: auto;
			max-width: 100%;
		}

		.schema-img, .block-img {
			display: block;
			margin: 15px auto;
			max-width: 100%;
			height: auto;
			border-radius: 12px;
			cursor: pointer;
		}

		/* 6. SVG И ПОИСК ID */
		svg * { pointer-events: all !important; }
		svg > g > rect:first-child, svg > rect:first-child { pointer-events: none !important; }
		[id^="anjiv"] { cursor: pointer; }

		/* 7. ВСПЛЫВАЮЩИЕ ПОДСКАЗКИ (SVG) */
		.hover-popup {
			position: absolute;
			z-index: 10000;
			background: #1a1228;
			border: 2px solid #ffb347;
			border-radius: 12px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.6);
			display: none;
			pointer-events: none !important;
			max-width: 350px;
			overflow: hidden;
		}

		.tooltip-container { display: flex; flex-direction: column; }
		.tooltip-container img { width: 100%; height: auto; display: block; border-bottom: 1px solid #5a3e7a; }
		.tooltip-content { padding: 10px; text-align: center; }
		.tooltip-title { color: #ffb347; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
		.tooltip-text { color: #f5e6b8; font-size: 13px; line-height: 1.4; }

		/* --- 8. ИКОНКИ С КАРТИНКАМИ ИЗ БАЗЫ (HINT-BOX) --- */
		.hint-box {
			display: inline-block;
			position: relative;
			vertical-align: middle;
			margin: 0 3px;
		}

		/* Иконка 25х25 */
		.hint-box .hint-icon {
			width: 25px !important;
			height: 25px !important;
			display: block;
			border: 1px solid #ffb347; 
			border-radius: 4px;
			object-fit: cover;
		}

		/* Всплывающее окно базы лута */
		.hint-content {
			display: none;
			position: absolute;
			bottom: calc(100% + 10px);
			left: 50%;
			transform: translateX(-50%);
			width: max-content;   
			max-width: 600px;     
			background: #1a1228;
			border: 2px solid #ffb347;
			border-radius: 12px;
			z-index: 99999;
			box-shadow: 0 10px 30px rgba(0,0,0,0.6);
			overflow: hidden;
			pointer-events: none;
		}

		/* ВОТ ЭТО ПРАВИЛО ИСПРАВИТ ЛУТ: */
		.hint-content img {
			display: block !important;   /* Превращает инлайновую картинку в блок и уничтожает зазор снизу */
			max-width: 100%;
			height: auto;
			margin: 0 !important;
			padding: 0 !important;
		}

		.hint-box:hover .hint-content { display: block !important; }

		/* Большая всплывающая картинка предмета/лута */
		.hint-img-large { 
			max-width: 100%; 
			height: auto; 
			display: block;
			border-bottom: none !important; /* Убрана фиолетовая полоса */
		}
		
		/* Текст в hint-content больше никогда не нужен и не занимает место */
		.hint-text { 
			display: none !important; 
		}

		/* АДАПТИВНОСТЬ */
		@media (max-width: 800px) {
			.guide-container { flex-direction: column; }
			.sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; }
			.section-btn { flex: 1 0 auto; text-align: center; }
		}
		/* Контейнер для картинки на главной */
		.welcome-image-container {
            position: relative;
            width: fit-content;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            background: transparent; /* Чтобы не было лишних рамок */
        }

        .vignette img {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: 450px;
            
            /* Настройки экстремального овального затухания */
            -webkit-mask-image: radial-gradient(
                ellipse 50% 80% at 50% 50%, 
                black 40%, 
                transparent 90%
            );
            mask-image: radial-gradient(
                ellipse 50% 80% at 50% 50%, 
                black 40%, 
                transparent 90%
            );
        }
		/* 9. Всплывающее окно для куска текста (цвет и стиль текста указывать вручную)*/
		.hint-trigger {
			position: relative;
			display: inline-block;
			cursor: help;
		}

		/* Показываем подсказку при наведении */
		.hint-trigger:hover .hint-content {
			display: block !important;
		}
		/*Плавная прокрутка*/
		html {
		scroll-behavior: smooth;
		}
		/*Цвет текста ссылок (по умолчанию)*/
		.text-link {
        color: inherit; /* или указать конкретный цвет, например #333333 */
        text-decoration: underline;
		}
		.important a:hover {
			color: orange;      /* при наведении курсора */
		}

		.important a:active {
			color: red;         /* при нажатии */
		}
		/* ==========================================================================
		   ПОЛНЫЙ И ИСПРАВЛЕННЫЙ БЛОК CSS ДЛЯ БАЗЫ ПРЕДМЕТОВ И ВАЛЮТЫ
		   ========================================================================== */

		/* Контейнер-обертка всей базы */
		.database-wrapper {
			margin-top: 15px;
			width: 100%;
		}

		/* Красивый заголовок раздела */
		.database-title {
			color: #ffb347;
			font-size: 22px;
			margin-bottom: 12px;
			padding-bottom: 6px;
			border-bottom: 2px solid #5a3e7a;
		}

		/* Адаптивная обертка для прокрутки таблицы на телефонах */
		.table-responsive {
			width: 100%;
			overflow-x: auto;
			border-radius: 8px;
			border: 1px solid #5a3e7a;
		}

		/* Сама таблица базы */
		.items-table {
			width: 100%;
			border-collapse: collapse;
			background: #1e152a;
			color: #f5e6b8;
			line-height: 1.3;
		}

		/* Шапка таблицы (заголовки столбцов) */
		.items-table th {
			background: linear-gradient(135deg, #4d3366 0%, #352249 100%);
			color: #ffcf8a;
			font-weight: 600;
			text-transform: uppercase;
			font-size: 12px;
			letter-spacing: 0.5px;
			padding: 8px 6px;
			border-bottom: 2px solid #ffb347;
			text-align: center;
		}

		/* Унифицированный размер шрифта и выравнивание для всех обычных ячеек таблицы */
		.items-table td {
			padding: 10px 10px;
			border-bottom: 1px solid #3d2a52;
			
			/* Выравнивание всего текста описания строго по верхнему краю */
			vertical-align: top; 
			text-align: left;
			
			/* Жестко задаем размер шрифта для столбцов 3, 4, 5 как у названия предмета */
			font-size: 13px !important; 
			
			/* Минимальная высота под иконку 65х65 + зазоры, но строка растет сама, если текста много */
			min-height: 75px; 
			height: auto; 
		}

		/* Сброс влияния сторонних тегов (p, div, li) на размер шрифта внутри ячеек */
		.items-table td p,
		.items-table td div,
		.items-table td span,
		.items-table td li,
		.items-table td ul {
			font-size: 13px !important; 
			margin: 0 !important;
			padding: 0;
		}

		/* Столбец №1: Зона иконки — теперь тоже жестко выровнен по ВЕРХНЕМУ краю */
		.items-table td:first-child {
			text-align: center;
			vertical-align: top; /* Иконка теперь всегда будет прижата к верху */
			width: 85px;
			padding: 10px 4px; /* Выравниваем внутренний отступ с остальными ячейками */
		}

		/* Стандарт для основных иконок (65x65) */
		.db-item-icon-large {
			width: 65px !important;
			height: 65px !important;
			object-fit: cover;
			border: 2px solid #ffb347;
			border-radius: 6px;
		}

		/* Стандарт для мелких иконок (30x30) */
		.db-item-icon-small {
			width: 30px !important;
			height: 30px !important;
			object-fit: cover;
			border: 1px solid #ffb347; /* Рамка тоньше, так как иконка маленькая */
			border-radius: 4px;
		}

		/* Столбец №2: Статичное название предмета (жирный, белый, подчеркнутый) */
		.db-item-name-static {
			color: #f2f2f2 !important;
			font-weight: bold;
			text-decoration: underline;
			font-size: 13px !important;
			display: inline;
		}

		/* Контейнер для скриншотов внутри описаний (выравнивает их по центру ячейки) */
		.table-screenshot-container {
			display: block;
			text-align: center;
			margin-top: 8px;
			width: 100%;
		}

		/* Скриншоты в ячейках (Отредактировано: исходный размер, без рамок и увеличения) */
		.table-screenshot-container img,
		.table-screenshot {
			display: block;
			width: auto;
			height: auto;
			max-width: calc(100% - 20px); /* Исходный размер, но не более ширины столбца минус 20px */
			margin: 5px auto; /* Центрируем скриншот */
			border: none !important; /* Полностью убираем рамку */
			border-radius: 0; /* Убираем скругление, если нужен чистый скрин */
			box-shadow: none !important; /* Убираем тени */
			transform: none !important; /* Никакого изменения масштаба */
			transition: none !important; /* Убираем анимацию */
			cursor: default; /* Обычный курсор вместо лупы */
		}

		/* Анимация полусекундной мягкой золотой вспышки строки при быстром прыжке */
		@keyframes quick-row-flash {
		0% { background-color: rgba(255, 179, 71, 0.5); }
		30% { background-color: rgba(255, 179, 71, 0.5); }
		100% { background-color: transparent; }
		}
		.table-row-highlight,
		div.table-row-highlight,
		p.table-row-highlight,
		span.table-row-highlight {
			animation: quick-row-flash 0.8s cubic-bezier(0.25, 1, 0.5, 1) !important;
		}

		/* Текст-ссылка в самом тексте гайда */
		.item-text-trigger {
			display: inline-flex;
			align-items: center;
			gap: 5px;
			color: #f2f2f2 !important;
			font-weight: bold;
			text-decoration: underline;
			cursor: pointer; /* Курсор в виде знака вопроса на тексте */
			padding: 0 2px;
		}

		/* Динамическая мини-иконка 28х28, которая встает через пробел ПОСЛЕ текста */
		.item-text-icon-dynamic {
			width: 28px !important;
			height: 28px !important;
			object-fit: cover;
			border-radius: 4px;
			margin-left: 3px;
			vertical-align: middle;
			border: 1px solid #ffb347 !important; /* Твоя золотая рамка */
			cursor: help; /* Обычный курсор вопросов вместо лупы */
			pointer-events: auto !important; /* Позволяет иконке отдельно ловить ховер */
			display: inline-block;
		}
		/* === СТИЛИ ДЛЯ РАЗДЕЛА БАЗЫ ЛУТА === */
		.loot-section-container {
			display: flex;
			flex-direction: column;
			gap: 20px;
			width: 100%;
			box-sizing: border-box;
		}

		/* Верхняя панель управления (Лево 1/3, Право 2/3) */
		.loot-control-panel {
			display: flex;
			gap: 20px;
			width: 100%;
			overflow: visible !important; 
		}

		/* Левое окно менеджера (Высота и обводка один в один как у правого) */
		.loot-manager-left {
			width: 33.333%;
			background: #1f142e;
			border: 2px solid #ffb347; /* Золотая обводка синхронизирована */
			border-radius: 14px;
			padding: 15px;
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
			gap: 12px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
			overflow: visible !important; 
			position: relative;
			height: 220px; /* Идентичная фиксированная высота */
		}

		/* Текст-описание внутри менеджера */
		.loot-manager-desc {
			color: #aaa;
			font-size: 12px;
			line-height: 1.4;
			margin: 0 0 8px 0 !important;
			text-align: left;
		}

		/* Правое окно превью зоны */
		.loot-preview-right {
			width: 66.666%;
			background: #1a1228;
			border: 2px solid #ffb347; /* Золотая обводка синхронизирована с левым */
			border-radius: 14px;
			padding: 0 !important; 
			box-sizing: border-box;
			display: flex !important;
			flex-direction: row !important; /* Картинка слева, текстовый блок справа */
			align-items: center !important; /* Центрирует внутренний контент по вертикальной оси */
			justify-content: flex-start !important; 
			height: 220px; /* Фиксированная высота */
			position: relative;
			overflow: hidden !important;
			box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
		}

		/* Обертка для стартового текста "Зона не выбрана" */
		.loot-preview-empty-wrap {
			display: flex !important;
			flex-direction: column !important;
			align-items: center !important;
			justify-content: center !important;
			width: 100% !important;
			height: 100% !important;
			text-align: center !important;
			padding: 15px !important;
			box-sizing: border-box;
		}

		/* Блок с текстовой информацией (Название + Босс), сдвинутый вверх */
		.loot-preview-info-block {
			display: flex;
			flex-direction: column;
			gap: 2px; /* Расстояние между Названием данжа и строкой Босса */
			align-self: flex-start; /* Прижимает весь текстовый блок к самому верху окна */
			padding-top: 4px; /* Красивый отступ сверху от рамки подземелья */
			padding-left: 25px; /* Отступ текстового блока от картинки */
			z-index: 2;
		}

		/* Название зоны/подземелья (Верхняя строка) */
		.loot-preview-title {
			font-size: 22px !important;
			color: #ffb347 !important;
			font-weight: bold !important;
			margin: 0 !important;
			text-shadow: 0 2px 4px rgba(0,0,0,0.8);
			text-align: left !important;
			padding-left: 0 !important; /* Обнуляем, так как padding теперь у всей обертки */
		}

		/* Строка с иконкой и именем босса (Вторая строка) */
		.loot-preview-boss-line {
			display: flex;
			align-items: center; /* Центрирует иконку рожицы и текст имени по горизонтали */
			gap: 8px; /* Расстояние между иконкой рожицы и именем босса */
		}

		/* Статичная иконка рожицы босса */
		.loot-boss-icon {
			width: 24px !important;   /* Компактный и аккуратный размер */
			height: 24px !important;
			object-fit: contain !important;
			display: inline-block !important;
		}

		/* Отображение имени босса */
		.loot-boss-name {
			color: #CD5C5C; /* Цвет имени босса в базе лута*/
			font-size: 14px;
			font-weight: bold;
			text-shadow: 0 1px 3px rgba(0,0,0,0.5);
		}

		/* Картинка подземелья (БЕЗ золотой обводки) */
		.loot-preview-image {
			height: calc(100% - 6px) !important; /* Высота окошка минус 6px */
			margin-top: 3px !important; 
			margin-bottom: 3px !important; 
			margin-left: 3px !important; 
			width: auto !important; 
			max-width: 45% !important; 
			border-radius: 10px !important; 
			border: none !important; /* ЗОЛОТАЯ ОБВОДКА УБРАНА */
			object-fit: contain !important; 
			z-index: 2;
			box-shadow: 3px 0 10px rgba(0,0,0,0.4);
			display: block !important;
		}

		/* Вкладки (Tabs) */
		.loot-tabs {
			display: flex;
			gap: 5px;
			border-bottom: 2px solid #2a1a3a;
			padding-bottom: 8px;
			margin-top: auto; 
		}

		.loot-tab-btn {
			flex: 1;
			background: #2a1a3a;
			border: 1px solid #ffb347;
			color: #ffb347;
			padding: 8px 5px;
			font-size: 13px;
			font-weight: bold;
			border-radius: 6px;
			cursor: pointer;
			text-align: center;
			transition: all 0.2s ease;
		}

		.loot-tab-btn:hover {
			background: #ffb347;
			color: #1a1228;
		}

		.loot-tab-btn.active {
			background: #ffb347;
			color: #1a1228;
			box-shadow: 0 0 10px rgba(255, 179, 71, 0.4);
		}

<script>
// ===== ЛОГИКА РАБОТЫ РАЗДЕЛА РОТАЦИЙ =====
(function() {
    // Функция заполнения выпадающего списка с иконками
function populateClassDropdown() {
    const select = document.getElementById('classSelect');
    if (!select) return;
    
    select.innerHTML = '<option value="">— Выберите класс персонажа —</option>';
    
    for (const [key, classData] of Object.entries(window.classDatabase)) {
        const option = document.createElement('option');
        option.value = key;
        // Иконка 32x32 + название класса
        option.innerHTML = `<img src="${classData.icon}" style="width:32px;height:32px;vertical-align:middle;border-radius:4px;margin-right:8px;"> ${classData.name}`;
        select.appendChild(option);
    }
}
    
    // Функция отображения специализаций (в правом окне)
    function displaySpecs(classKey) {
        const container = document.getElementById('specContainer');
        if (!container) return;
        
        container.innerHTML = '';
        
        if (!classKey || !window.classDatabase[classKey]) {
            container.innerHTML = '<span style="color:#666;font-size:13px;">Выберите класс слева</span>';
            return;
        }
        
        const classData = window.classDatabase[classKey];
        const specs = classData.specs || [];
        
        if (specs.length === 0) {
            container.innerHTML = '<span style="color:#666;font-size:13px;">Нет специализаций</span>';
            return;
        }
        
        // Создаём картинки-кнопки
        specs.forEach((spec, index) => {
            const img = document.createElement('img');
            img.src = spec.img || 'data:image/png;base64,...';
            img.alt = spec.name;
            img.title = spec.name;
            img.className = 'rotation-spec-btn';
            img.dataset.specIndex = index;
            img.dataset.classKey = classKey;
            
            img.addEventListener('click', function() {
                document.querySelectorAll('.rotation-spec-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                showRotation(classKey, index);
            });
            
            container.appendChild(img);
        });
    }
    
    // Функция отображения ротации (в нижнем окне - 5 блоков)
function showRotation(classKey, specIndex) {
    const content = document.getElementById('rotationContent');
    if (!content) return;
    
    const classData = window.classDatabase[classKey];
    if (!classData) {
        content.innerHTML = '<p style="color:red;">Класс не найден</p>';
        return;
    }
    
    const spec = classData.specs[specIndex];
    if (!spec) {
        content.innerHTML = '<p style="color:red;">Специализация не найдена</p>';
        return;
    }
    
    // ===== 5 БЛОКОВ ДЛЯ РЕДАКТОРА =====
    content.innerHTML = `
        <div style="margin-bottom:10px;">
            <h3 style="color:#ffb347;font-size:20px;margin-bottom:4px;">${classData.name} — ${spec.name}</h3>
            <p style="color:#888;font-size:13px;margin-bottom:12px;">Редактируйте блоки ниже для наполнения контентом</p>
        </div>
        
        <!-- БЛОК 1: Картинка талантов -->
        <div class="block">
            <div class="block-title">
                📸 БЛОК 1 <span class="badge">картинка талантов</span>
            </div>
            <img class="block-image" src="data:image/png;base64,..." alt="Картинка талантов" style="max-width:100%;">
            <p style="color:#666;font-size:12px;margin-top:4px;">⬆️ Замените src на вашу картинку талантов</p>
        </div>
        
        <!-- БЛОК 2: Текст-комментарий к картинке талантов -->
        <div class="block">
            <div class="block-title">
                📝 БЛОК 2 <span class="badge">комментарий к талантам</span>
            </div>
            <div class="block-text">
                Здесь будет описание талантов, пояснения к картинке выше.
                Замените этот текст на ваш комментарий.
            </div>
        </div>
        
        <!-- БЛОК 3: Картинка улучшение скилов -->
        <div class="block">
            <div class="block-title">
                ⚡ БЛОК 3 <span class="badge">улучшение скилов</span>
            </div>
            <img class="block-image" src="data:image/png;base64,..." alt="Улучшение скилов" style="max-width:100%;">
            <p style="color:#666;font-size:12px;margin-top:4px;">⬆️ Замените src на вашу картинку улучшения скилов</p>
        </div>
        
        <!-- БЛОК 4: Текст-комментарий к скилам -->
        <div class="block">
            <div class="block-title">
                💬 БЛОК 4 <span class="badge">комментарий к скилам</span>
            </div>
            <div class="block-text">
                Здесь будет описание улучшений скилов, пояснения к картинке выше.
                Замените этот текст на ваш комментарий.
            </div>
        </div>
        
        <!-- БЛОК 5: SVG схема -->
        <div class="block">
            <div class="block-title">
                📊 БЛОК 5 <span class="badge">SVG схема</span>
            </div>
            <div class="block-svg">
                <!-- ВСТАВЬТЕ ВАШ SVG КОД ЗДЕСЬ -->
                <svg width="400" height="60" xmlns="http://www.w3.org/2000/svg" style="background:#1a1228;border-radius:6px;">
                    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="#ffb347" font-size="14px">
                        Вставьте сюда ваш SVG код
                    </text>
                </svg>
            </div>
            <div class="block-svg-comment">
                📌 Комментарий к схеме: описание того, что изображено на SVG.
            </div>
            <div class="block-svg" style="margin-top:10px;">
                <!-- ЕЩЁ ОДНА СТРОКА SVG, ЕСЛИ НУЖНО -->
                <svg width="400" height="40" xmlns="http://www.w3.org/2000/svg" style="background:#1a1228;border-radius:6px;">
                    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="#5a3e7a" font-size="12px">
                        Ещё одна SVG строка (если нужно)
                    </text>
                </svg>
            </div>
            <div class="block-svg-comment">
                📌 Ещё один комментарий к схеме.
            </div>
        </div>
    `;
}
    
    // Обработчик выбора класса
    document.addEventListener('change', function(e) {
        if (e.target && e.target.id === 'classSelect') {
            const classKey = e.target.value;
            displaySpecs(classKey);
            
            // Очищаем нижнее окно
            const content = document.getElementById('rotationContent');
            if (content) {
                content.innerHTML = `
                    <p style="color: #888; text-align: center; padding: 30px 0;">
                        👆 Выберите специализацию справа<br>
                        <span style="font-size: 13px; color: #666;">Нажмите на иконку специализации</span>
                    </p>
                `;
            }
        }
    });
    
    // Инициализация при загрузке раздела
    function initRotationSection() {
        populateClassDropdown();
        displaySpecs(null);
        
        // Сбрасываем нижнее окно
        const content = document.getElementById('rotationContent');
        if (content) {
            content.innerHTML = `
                <p style="color: #888; text-align: center; padding: 30px 0;">
                    👈 Выберите класс и специализацию<br>
                    <span style="font-size: 13px; color: #666;">После выбора здесь появится ротация</span>
                </p>
            `;
        }
    }
    
    // Делаем функции глобальными
    window.initRotationSection = initRotationSection;
    window.showRotation = showRotation;
    
    // Автоматическая инициализация
    if (document.getElementById('classSelect')) {
        initRotationSection();
    }
})();
</script>
<script>
    // === ЕДИНЫЙ КОМПЛЕКС СКРИПТОВ: НАВИГАЦИЯ, СКРОЛЛ И ХОВЕРЫ ===
    const buttons = document.querySelectorAll('.section-btn');
    const infoArea = document.getElementById('infoArea');

    // СДЕЛАНО ГЛОБАЛЬНЫМ: Хранение координат теперь доступно для всех скриптов страницы
    window.scrollPositions = {};
    let currentSectionId = null;
    
    // ПРЕДОХРАНИТЕЛЬ: блокирует запись ложных координат при переключении разделов
    let isSwitching = false;

    // Базовая функция переключения вкладок
    function switchSection(sectionId) {
        if (currentSectionId === sectionId) return;

        const docEl = document.documentElement || document.body;

        // 1. Перед уходом сохраняем точную координату старого раздела
        if (currentSectionId) {
            window.scrollPositions[currentSectionId] = window.scrollY || docEl.scrollTop;
        }

        // Включаем блокировку трекера скролла на время переключения
        isSwitching = true;

        // 2. Мягко очищаем хэш адресной строки браузера
        if (window.location.hash) {
            history.replaceState(null, null, ' ');
        }

        // 3. Меняем контент на экране
        infoArea.innerHTML = sectionsContent[sectionId] || '<p>Раздел временно недоступен</p>';
        
		if (sectionId === 'rotation') {
			setTimeout(() => {
				if (typeof window.initRotationSection === 'function') {
					window.initRotationSection();
				}
			}, 20);
		}
		
        // === АВТОМАТИЧЕСКИЙ ТРИГГЕР ДЛЯ БАЗЫ ЛУТА ===
        if (sectionId === 'loot') {
            // Даем разметке внедриться в DOM, затем строим меню и восстанавливаем состояние
            setTimeout(() => {
                if (window.lastLootZoneKey && window.localDatabase && window.localDatabase[window.lastLootZoneKey]) {
                    const savedData = window.localDatabase[window.lastLootZoneKey];
                    if (typeof window.switchLootCategory === 'function') {
                        window.switchLootCategory(savedData.type, null);
                        window.selectLootZone(window.lastLootZoneKey);
                    }
                } else {
                    window.currentLootCategory = 'dungeon';
                    const firstTab = document.querySelector('.loot-tab-btn');
                    if (firstTab) {
                        document.querySelectorAll('.loot-tab-btn').forEach(b => b.classList.remove('active'));
                        firstTab.classList.add('active');
                    }
                    if (typeof window.renderLootDropdownItems === 'function') {
                        window.renderLootDropdownItems();
                    }
                }
            }, 20);
        }

        // Подсвечиваем активную кнопку в меню
        buttons.forEach(btn => {
            if (btn.getAttribute('data-section') === sectionId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        // Запоминаем, где мы сейчас находимся
        currentSectionId = sectionId;

        // Восстановление парсеров при переключении на вкладку (чтобы ссылки не пропадали)
        if (typeof window.processItemReferences === 'function') window.processItemReferences();
        if (typeof window.processLocalReferences === 'function') window.processLocalReferences();

        // 4. БЕЗОПАСНОЕ ВОССТАНОВЛЕНИЕ КООРДИНАТ
        requestAnimationFrame(() => {
            if (window.scrollPositions[sectionId] !== undefined) {
                window.scrollTo(0, window.scrollPositions[sectionId]);
                docEl.scrollTop = window.scrollPositions[sectionId];
            } else {
                window.scrollTo(0, 0);
                docEl.scrollTop = 0;
            }

            setTimeout(() => {
                isSwitching = false;
            }, 50);
        });
    }

    // ПОСТОЯННЫЙ ТРЕКЕР С КРИТИЧЕСКИМ ФИЛЬТРОМ ОШИБОК
    window.addEventListener('scroll', () => {
        if (isSwitching) return; 

        if (currentSectionId) {
            const docEl = document.documentElement || document.body;
            window.scrollPositions[currentSectionId] = window.scrollY || docEl.scrollTop;
        }
    }, { passive: true });

    buttons.forEach(btn => {
        btn.addEventListener('click', () => switchSection(btn.getAttribute('data-section')));
    });

    document.addEventListener('DOMContentLoaded', () => {
        const activeBtn = document.querySelector('.section-btn.active');
        if (activeBtn) {
            currentSectionId = activeBtn.getAttribute('data-section');
        }
    });
	
	// ===== КНОПКА СОХРАНИТЬ =====
document.addEventListener('DOMContentLoaded', function() {
    const saveBtn = document.getElementById('saveRotationBtn');
    if (saveBtn) {
        saveBtn.addEventListener('click', function() {
            // Собираем данные из всех блоков
            const content = document.getElementById('rotationContent');
            if (!content) {
                alert('❌ Нет контента для сохранения');
                return;
            }
            
            // Здесь вы можете собрать данные из полей ввода
            // и сохранить их в localStorage или отправить на сервер
            
            // Простой пример сохранения в localStorage
            const classSelect = document.getElementById('classSelect');
            const selectedClass = classSelect ? classSelect.value : 'unknown';
            
            // Сохраняем состояние
            const data = {
                class: selectedClass,
                content: content.innerHTML,
                timestamp: new Date().toISOString()
            };
            
            try {
                localStorage.setItem('rotationData_' + selectedClass, JSON.stringify(data));
                alert('✅ Данные сохранены!');
            } catch(e) {
                alert('❌ Ошибка сохранения: ' + e.message);
            }
        });
    }
});
</script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #2a1a3a 0%, #1e1230 100%);
            font-family: 'Segoe UI', 'Noto Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .access-wrapper {
            max-width: 600px;
            width: 100%;
            background: #2a1e3a;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            padding: 20px;
            z-index: 2;
        }

        .access-card {
            background: #271e34;
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            border: 1px solid #5a3e7a;
            text-align: center;
        }

        h1 {
            color: #ffb347;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 500;
            border-bottom: 2px solid #5a3e7a;
            padding-bottom: 10px;
        }

        .task-list {
            text-align: left;
            margin: 20px auto;
            display: inline-block;
        }

        .task {
            margin: 12px 0;
            font-size: 17px;
            color: #d0c0e0;
            display: flex;
            align-items: center;
        }

        .icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            border: 2px solid #5a3e7a;
            border-top: 2px solid #ffb347;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #ff6b6b;
            padding: 20px;
            background: rgba(255, 80, 80, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 16px;
        }

        .footer-image {
            margin-top: 20px;
            max-width: 100%;
            display: block;
        }
    </style>
</head>
<body>
<div id="app-root"></div>
<div class="access-wrapper">
    <div class="access-card" id="mainCard">
        <h1>Авторизация</h1>
        <div class="task-list">
            <div class="task" id="t1"><div class="icon">○</div> Проверка доступа</div>
            <div class="task" id="t2"><div class="icon">○</div> Загрузка гайда</div>
        </div>
    </div>
</div>

<img class="footer-image" src="revival_1.png" alt="Revival Art">

<script>
    const BOT_API = "https://revivalbot.onrender.com";
    const TOKEN_KEY = 'revival_token';

    function setTaskStatus(id, status) {
        const task = document.getElementById(id);
        const icon = task.querySelector('.icon');
        if (status === 'loading') {
            icon.innerHTML = '<div class="spinner"></div>';
        } else if (status === 'done') {
            icon.innerHTML = '✅';
            task.style.color = '#77dd77';
        } else if (status === 'error') {
            icon.innerHTML = '❌';
            task.style.color = '#ff6b6b';
        }
    }

    function showError(msg) {
        document.getElementById('mainCard').innerHTML = `<div class="error">${msg}</div>`;
    }

    async function initAccess() {
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('key') || localStorage.getItem(TOKEN_KEY);
        
        if (!token) { 
            showError('❌ Токен не найден. Перейдите по ссылке из бота.'); 
            return; 
        }
        localStorage.setItem(TOKEN_KEY, token);

        // ШАГ 1: Проверка токена (реальная)
        setTaskStatus('t1', 'loading');
        setTaskStatus('t2', 'loading');

        try {
            const startTime = Date.now();
            const response = await fetch(`${BOT_API}/get-guide?key=${encodeURIComponent(token)}`);
            
            // Реальное время проверки токена
            const tokenCheckTime = Date.now() - startTime;
            console.log(`⏱️ Проверка токена: ${tokenCheckTime}мс`);
            
            if (!response.ok) throw new Error("Токен недействителен или истек.");
            const data = await response.json();
            
            setTaskStatus('t1', 'done'); // ✅ Реально: токен проверен

            // ШАГ 2: Загрузка и рендеринг гайда (реальный)
            // Создаем iframe для честного отслеживания загрузки
            const iframe = document.createElement('iframe');
            iframe.style.cssText = 'width:100vw; height:100vh; border:none; position:fixed; top:0; left:0; z-index:9999; background:#1e1230; display:none;';
            document.body.appendChild(iframe);

            // Когда iframe загрузится - значит гайд реально отрисовался
            iframe.onload = function() {
                const renderTime = Date.now() - startTime;
                console.log(`⏱️ Полная загрузка гайда: ${renderTime}мс`);
                setTaskStatus('t2', 'done'); // ✅ Реально: гайд загружен и отрисован
                
                // Показываем iframe
                iframe.style.display = 'block';
                
                // Скрываем загрузчик
                document.querySelector('.access-wrapper').style.display = 'none';
                document.querySelector('.footer-image').style.display = 'none';
            };

            // Загружаем HTML в iframe
            const blob = new Blob([data.html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            iframe.src = url;

            // Таймаут на всякий случай (если что-то пойдет не так)
            setTimeout(() => {
                if (document.getElementById('t2').style.color !== '#77dd77') {
                    console.warn('⚠️ Таймаут загрузки гайда, показываем принудительно');
                    iframe.style.display = 'block';
                    document.querySelector('.access-wrapper').style.display = 'none';
                    document.querySelector('.footer-image').style.display = 'none';
                    setTaskStatus('t2', 'done');
                }
            }, 10000);

        } catch (error) {
            localStorage.removeItem(TOKEN_KEY);
            setTaskStatus('t1', 'error');
            setTaskStatus('t2', 'error');
            showError('⚠️ Ошибка: ' + error.message);
        }
    }

    window.addEventListener('DOMContentLoaded', initAccess);
</script>
</body>
</html>

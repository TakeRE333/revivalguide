<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Доступ к гайду | Asura BnS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #2a1a3a 0%, #1e1230 100%);
            font-family: 'Segoe UI', 'Noto Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .access-wrapper {
            max-width: 600px;
            width: 100%;
            background: #2a1e3a;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            padding: 20px;
            z-index: 2;
        }

        .access-card {
            background: #271e34;
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            border: 1px solid #5a3e7a;
            text-align: center;
        }

        h1 {
            color: #ffb347;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 500;
            border-bottom: 2px solid #5a3e7a;
            padding-bottom: 10px;
        }

        .error-box {
            background: rgba(255, 80, 80, 0.15);
            border: 1px solid #ff6b6b;
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
        }

        .error-text {
            color: #f5e6b8;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        code {
            background: rgba(255, 179, 71, 0.15);
            color: #ffe0a3;
            padding: 4px 12px;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 1.1em;
            border: 1px solid rgba(255, 179, 71, 0.3);
            display: inline-block;
        }

        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #5a3e7a;
            border-top: 3px solid #ffb347;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-image {
            margin-top: 20px;
            max-width: 100%;
            display: block;
        }

        .info-text {
            font-size: 14px;
            color: #a090b0;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="access-wrapper">
    <div class="access-card" id="mainCard">
        <!-- Содержимое будет динамически меняться -->
    </div>
</div>

<img class="footer-image" src="revival_1.png" alt="Revival Art">

<script>
    const BOT_API = 'https://revivalbot.onrender.com';
    const mainCard = document.getElementById('mainCard');
    
    // Функция показа состояния загрузки с изменяемым текстом
    function showLoading(statusText = "Пожалуйста, подождите...") {
        mainCard.innerHTML = `
            <h1>Проверка доступа</h1>
            <div class="loader"></div>
            <p style="color: #f5e6b8;" id="statusText">${statusText}</p>
        `;
    }
    
    // Вспомогательная функция для обновления текста
    function updateStatus(text) {
        const el = document.getElementById('statusText');
        if (el) el.innerText = text;
    }
    
    // Функция отображения ошибок
    function showError(message, showGuideMessage = false) {
        mainCard.innerHTML = `
            <h1>Доступ к гайду</h1>
            <div class="error-box">
                <p class="error-text">${message}</p>
                ${showGuideMessage ? `
                    <p class="error-text">Напишите в любом текстовом канале команду <code>/guide</code></p>
                    <p class="info-text">Бот выдаст вам персональную ссылку</p>
                ` : ''}
            </div>
        `;
    }

    // Главная логика загрузки
    async function initAccess() {
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('key') || localStorage.getItem('revival_token');
        
        if (!token) {
            showError('❌ Токен не найден. Воспользуйтесь ссылкой от бота.', true);
            return;
        }

        showLoading("Инициализация...");
        
        try {
            updateStatus("Проверка доступа...");
            const response = await fetch(`${BOT_API}/get-guide?key=${encodeURIComponent(token)}`);
            
            if (!response.ok) {
                localStorage.removeItem('revival_token');
                const errorText = await response.text();
                showError(`❌ ${errorText || 'Доступ запрещён'}`, true);
                return;
            }
            
            updateStatus("Доступ получен, загрузка гайда...");
            const html = await response.text();
            
            updateStatus("Завершение загрузки...");
            localStorage.setItem('revival_token', token);
            
            document.open();
            document.write(html);
            document.close();
            
        } catch (error) {
            console.error('Ошибка:', error);
            showError('⚠️ Ошибка соединения с сервером.', false);
        }
    }

    // Запуск при открытии страницы
    initAccess();
</script>

</body>
</html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #2a1a3a 0%, #1e1230 100%);
            font-family: 'Segoe UI', 'Noto Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .access-wrapper {
            max-width: 600px;
            width: 100%;
            background: #2a1e3a;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            padding: 20px;
            z-index: 2;
        }

        .access-card {
            background: #271e34;
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            border: 1px solid #5a3e7a;
            text-align: center;
        }

        h1 {
            color: #ffb347;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 500;
            border-bottom: 2px solid #5a3e7a;
            padding-bottom: 10px;
        }

        .task-list {
            text-align: left;
            margin: 20px auto;
            display: inline-block;
            width: 100%;
            max-width: 350px;
        }

        .task {
            margin: 12px 0;
            font-size: 17px;
            color: #d0c0e0;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            transition: all 0.3s ease;
        }

        .task .icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .task .label {
            flex: 1;
        }

        .task .status {
            font-size: 13px;
            color: #888;
            min-width: 60px;
            text-align: right;
        }

        .task.loading .status {
            color: #ffb347;
        }

        .task.done {
            color: #77dd77;
        }

        .task.done .status {
            color: #77dd77;
        }

        .task.error {
            color: #ff6b6b;
        }

        .task.error .status {
            color: #ff6b6b;
        }

        .spinner {
            border: 2px solid #5a3e7a;
            border-top: 2px solid #ffb347;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-box {
            background: rgba(255, 80, 80, 0.15);
            border: 1px solid #ff6b6b;
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
        }

        .error-text {
            color: #f5e6b8;
            font-size: 17px;
            line-height: 1.6;
        }

        .error-text code {
            background: rgba(255, 179, 71, 0.15);
            color: #ffe0a3;
            padding: 4px 12px;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 1.1em;
            border: 1px solid rgba(255, 179, 71, 0.3);
            display: inline-block;
        }

        .info-text {
            font-size: 14px;
            color: #a090b0;
            margin-top: 15px;
        }

        .footer-image {
            margin-top: 20px;
            max-width: 100%;
            display: block;
        }
    </style>
</head>
<body>

<div class="access-wrapper">
    <div class="access-card" id="mainCard">
        <h1>Авторизация</h1>
        <div class="task-list">
            <div class="task" id="taskToken">
                <span class="icon">○</span>
                <span class="label">Проверка доступа</span>
                <span class="status">ожидание</span>
            </div>
            <div class="task" id="taskGuide">
                <span class="icon">○</span>
                <span class="label">Загрузка гайда</span>
                <span class="status">ожидание</span>
            </div>
        </div>
    </div>
</div>

<img class="footer-image" src="revival_1.png" alt="Revival Art">

<script>
    const BOT_API = 'https://revivalbot.onrender.com';
    const TOKEN_KEY = 'revival_token';

    const taskToken = document.getElementById('taskToken');
    const taskGuide = document.getElementById('taskGuide');

    function setTaskStatus(taskEl, status, statusText) {
        taskEl.classList.remove('loading', 'done', 'error');
        const icon = taskEl.querySelector('.icon');
        const statusSpan = taskEl.querySelector('.status');
        if (status === 'loading') {
            taskEl.classList.add('loading');
            icon.innerHTML = '<div class="spinner"></div>';
            statusSpan.textContent = statusText || 'загрузка...';
        } else if (status === 'done') {
            taskEl.classList.add('done');
            icon.innerHTML = '✅';
            statusSpan.textContent = statusText || 'готово';
        } else if (status === 'error') {
            taskEl.classList.add('error');
            icon.innerHTML = '❌';
            statusSpan.textContent = statusText || 'ошибка';
        }
    }

    function showError(message, showGuideHint = false) {
        const mainCard = document.getElementById('mainCard');
        mainCard.innerHTML = `
            <h1>Доступ к гайду</h1>
            <div class="error-box">
                <p class="error-text">${message}</p>
                ${showGuideHint ? `
                    <p class="error-text" style="margin-top:10px;">Напишите в любом текстовом канале команду <code>/guide</code></p>
                    <p class="info-text">Бот выдаст вам персональную ссылку</p>
                ` : ''}
            </div>
        `;
    }

    async function checkAccess() {
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('key') || localStorage.getItem(TOKEN_KEY);

        if (!token) {
            showError('❌ Токен не указан.', true);
            return;
        }

        // Запускаем оба процесса параллельно
        setTaskStatus(taskToken, 'loading', 'проверка...');
        setTaskStatus(taskGuide, 'loading', 'загрузка...');

        try {
            const response = await fetch(`${BOT_API}/get-guide?key=${encodeURIComponent(token)}`);

            if (!response.ok) {
                const errorText = await response.text();
                setTaskStatus(taskToken, 'error', 'отказ');
                setTaskStatus(taskGuide, 'error', 'отменено');
                localStorage.removeItem(TOKEN_KEY);
                showError(`❌ ${errorText || 'Доступ запрещён'}`, false);
                return;
            }

            const data = await response.json();
            
            // Токен проверен
            setTaskStatus(taskToken, 'done', 'доступ получен');
            localStorage.setItem(TOKEN_KEY, token);

            // Небольшая пауза для визуального эффекта
            await new Promise(resolve => setTimeout(resolve, 200));

            // Загружаем гайд
            document.open();
            document.write(data.html);
            document.close();

        } catch (error) {
            console.error('Ошибка:', error);
            setTaskStatus(taskToken, 'error', 'ошибка');
            setTaskStatus(taskGuide, 'error', 'не загружен');
            showError('⚠️ Ошибка соединения с сервером. Проверьте интернет.', false);
        }
    }

    checkAccess();
</script>

</body>
</html>

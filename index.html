    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #2a1a3a 0%, #1e1230 100%);
            font-family: 'Segoe UI', 'Noto Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .access-wrapper {
            max-width: 600px;
            width: 100%;
            background: #2a1e3a;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            padding: 20px;
            z-index: 2;
        }

        .access-card {
            background: #271e34;
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            border: 1px solid #5a3e7a;
            text-align: center;
        }

        h1 {
            color: #ffb347;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 500;
            border-bottom: 2px solid #5a3e7a;
            padding-bottom: 10px;
        }

        .task-list {
            text-align: left;
            margin: 20px auto;
            display: inline-block;
        }

        .task {
            margin: 12px 0;
            font-size: 17px;
            color: #d0c0e0;
            display: flex;
            align-items: center;
        }

        .icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            border: 2px solid #5a3e7a;
            border-top: 2px solid #ffb347;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #ff6b6b;
            padding: 20px;
            background: rgba(255, 80, 80, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 16px;
        }

        .footer-image {
            margin-top: 20px;
            max-width: 100%;
            display: block;
        }
    </style>
</head>
<body>
<div id="app-root"></div>
<div class="access-wrapper">
    <div class="access-card" id="mainCard">
        <h1>Авторизация</h1>
        <div class="task-list">
            <div class="task" id="t1"><div class="icon">○</div> Проверка доступа</div>
            <div class="task" id="t2"><div class="icon">○</div> Загрузка базы данных</div>
            <div class="task" id="t3"><div class="icon">○</div> Загрузка гайда</div>
        </div>
    </div>
</div>

<img class="footer-image" src="revival_1.png" alt="Revival Art">

<script>
    const BOT_API = "https://revivalbot.onrender.com";

    function setTaskStatus(id, status) {
        const task = document.getElementById(id);
        const icon = task.querySelector('.icon');
        if (status === 'loading') {
            icon.innerHTML = '<div class="spinner"></div>';
        } else if (status === 'done') {
            icon.innerHTML = '✅';
            task.style.color = '#77dd77';
        } else if (status === 'error') {
            icon.innerHTML = '❌';
            task.style.color = '#ff6b6b';
        }
    }

    function showError(msg) {
        document.getElementById('mainCard').innerHTML = `<div class="error">${msg}</div>`;
    }

    async function initAccess() {
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('key') || localStorage.getItem('revival_token');
        
        if (!token) { 
            showError('❌ Токен не найден. Перейдите по ссылке из бота.'); 
            return; 
        }
        localStorage.setItem('revival_token', token);

        try {
            // 1. Проверка доступа
            setTaskStatus('t1', 'loading');
            const response = await fetch(`${BOT_API}/get-guide?key=${encodeURIComponent(token)}`);
            if (!response.ok) throw new Error("Токен недействителен или истек.");
            const data = await response.json();
            setTaskStatus('t1', 'done');

            // 2. Загрузка всех баз данных в localStorage
            setTaskStatus('t2', 'loading');
            const baseUrl = "https://revivalbot.onrender.com/content/";
            const v = Date.now(); // Кэш-бастер

            // Загружаем все параллельно
            const [lootScript, svgScript, itemsHtml] = await Promise.all([
                fetch(`${baseUrl}database_loot.js?v=${v}`).then(r => r.text()),
                fetch(`${baseUrl}database_svg.js?v=${v}`).then(r => r.text()),
                fetch(`${baseUrl}database_items.html?v=${v}`).then(r => r.text())
            ]);

            // Сохраняем в localStorage
            localStorage.setItem('revival_loot_db', lootScript);
            localStorage.setItem('revival_svg_db', svgScript);
            localStorage.setItem('revival_items_db', itemsHtml);
            localStorage.setItem('revival_guide_html', data.html);
            localStorage.setItem('revival_token', token);
            
            setTaskStatus('t2', 'done');

            // 3. Переход на guide.html
            setTaskStatus('t3', 'loading');
            
            // Небольшая задержка для визуального эффекта
            setTimeout(() => {
                window.location.href = 'guide.html?key=' + encodeURIComponent(token);
            }, 500);

        } catch (error) {
            localStorage.removeItem('revival_token');
            setTaskStatus('t2', 'error');
            showError('⚠️ Ошибка загрузки: ' + error.message);
        }
    }

    window.addEventListener('DOMContentLoaded', initAccess);
</script>
</body>
</html>

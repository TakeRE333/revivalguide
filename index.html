    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #2a1a3a 0%, #1e1230 100%);
            font-family: 'Segoe UI', 'Noto Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .access-wrapper {
            max-width: 600px;
            width: 100%;
            background: #2a1e3a;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            padding: 20px;
            z-index: 2;
        }

        .access-card {
            background: #271e34;
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            border: 1px solid #5a3e7a;
            text-align: center;
        }

        h1 {
            color: #ffb347;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 500;
            border-bottom: 2px solid #5a3e7a;
            padding-bottom: 10px;
        }

        .task-list {
            text-align: left;
            margin: 20px auto;
            display: inline-block;
        }

        .task {
            margin: 12px 0;
            font-size: 17px;
            color: #d0c0e0;
            display: flex;
            align-items: center;
        }

        .icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            border: 2px solid #5a3e7a;
            border-top: 2px solid #ffb347;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #ff6b6b;
            padding: 20px;
            background: rgba(255, 80, 80, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 16px;
        }

        .footer-image {
            margin-top: 20px;
            max-width: 100%;
            display: block;
        }
    </style>
</head>
<body>
<div id="app-root"></div>
<div class="access-wrapper">
    <div class="access-card" id="mainCard">
        <h1>Авторизация</h1>
        <div class="task-list">
            <div class="task" id="t1"><div class="icon">○</div> Проверка доступа</div>
            <div class="task" id="t2"><div class="icon">○</div> Загрузка гайда</div>
        </div>
    </div>
</div>

<img class="footer-image" src="revival_1.png" alt="Revival Art">

<script>
    const BOT_API = "https://revivalbot.onrender.com";
    const CACHE_KEY = 'revival_guide_cache';
    const TOKEN_KEY = 'revival_token';
    const CACHE_VERSION = '1.0.0'; // ← МЕНЯЙ ПРИ ОБНОВЛЕНИИ ГАЙДА!

    function setTaskStatus(id, status) {
        const task = document.getElementById(id);
        const icon = task.querySelector('.icon');
        if (status === 'loading') {
            icon.innerHTML = '<div class="spinner"></div>';
        } else if (status === 'done') {
            icon.innerHTML = '✅';
            task.style.color = '#77dd77';
        } else if (status === 'error') {
            icon.innerHTML = '❌';
            task.style.color = '#ff6b6b';
        } else if (status === 'cached') {
            icon.innerHTML = '⚡';
            task.style.color = '#ffb347';
        }
    }

    function showError(msg) {
        document.getElementById('mainCard').innerHTML = `<div class="error">${msg}</div>`;
    }

    async function initAccess() {
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('key') || localStorage.getItem(TOKEN_KEY);
        
        if (!token) { 
            showError('❌ Токен не найден. Перейдите по ссылке из бота.'); 
            return; 
        }
        localStorage.setItem(TOKEN_KEY, token);

        // Проверяем кэш (с версией!)
        const cached = localStorage.getItem(CACHE_KEY);
        const cacheTime = localStorage.getItem(CACHE_KEY + '_time');
        const cachedVersion = localStorage.getItem(CACHE_KEY + '_version');
        const isCacheValid = cached && cacheTime && 
                             (Date.now() - parseInt(cacheTime) < 24 * 60 * 60 * 1000) &&
                             cachedVersion === CACHE_VERSION;

        if (isCacheValid) {
            // Быстрый старт из кэша
            setTaskStatus('t1', 'cached');
            setTaskStatus('t2', 'cached');
            
            document.open();
            document.write(cached);
            document.close();
            
            try {
                const response = await fetch(`${BOT_API}/get-guide?key=${encodeURIComponent(token)}`);
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem(CACHE_KEY, data.html);
                    localStorage.setItem(CACHE_KEY + '_time', Date.now().toString());
                    localStorage.setItem(CACHE_KEY + '_version', CACHE_VERSION); // ← СОХРАНЯЕМ ВЕРСИЮ
                    setTaskStatus('t1', 'done');
                    setTaskStatus('t2', 'done');
                    console.log('✅ Кэш обновлен в фоне');
                } else {
                    localStorage.removeItem(CACHE_KEY);
                    localStorage.removeItem(CACHE_KEY + '_time');
                    localStorage.removeItem(CACHE_KEY + '_version');
                    localStorage.removeItem(TOKEN_KEY);
                    showError('⚠️ Сессия истекла. Запросите новую ссылку у бота.');
                }
            } catch (e) {
                console.warn('Фоновая проверка не удалась, но гайд из кэша работает');
            }
            return;
        }

        // Нет кэша - загружаем
        setTaskStatus('t1', 'loading');
        setTaskStatus('t2', 'loading');

        try {
            const response = await fetch(`${BOT_API}/get-guide?key=${encodeURIComponent(token)}`);
            if (!response.ok) throw new Error("Токен недействителен или истек.");
            const data = await response.json();
            
            localStorage.setItem(CACHE_KEY, data.html);
            localStorage.setItem(CACHE_KEY + '_time', Date.now().toString());
            localStorage.setItem(CACHE_KEY + '_version', CACHE_VERSION); // ← СОХРАНЯЕМ ВЕРСИЮ
            
            setTaskStatus('t1', 'done');
            
            document.open();
            document.write(data.html);
            document.close();
            setTaskStatus('t2', 'done');

        } catch (error) {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(CACHE_KEY);
            localStorage.removeItem(CACHE_KEY + '_time');
            localStorage.removeItem(CACHE_KEY + '_version');
            setTaskStatus('t1', 'error');
            setTaskStatus('t2', 'error');
            showError('⚠️ Ошибка: ' + error.message);
        }
    }

    window.addEventListener('DOMContentLoaded', initAccess);
</script>
</body>
</html>

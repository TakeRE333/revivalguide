<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Доступ к гайду | Asura BnS</title>
    <meta name="color-scheme" content="light">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #2a1a3a 0%, #1e1230 100%);
            font-family: 'Segoe UI', 'Noto Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .access-wrapper {
            max-width: 600px;
            width: 100%;
            background: #2a1e3a;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            padding: 20px;
            z-index: 2;
        }
        .access-card {
            background: #271e34;
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            border: 1px solid #5a3e7a;
            text-align: center;
        }
        h1 {
            color: #ffb347;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 500;
            border-bottom: 2px solid #5a3e7a;
            padding-bottom: 10px;
        }
        .task-list {
            text-align: left;
            margin: 20px auto;
            display: inline-block;
            width: 100%;
            max-width: 350px;
        }
        .task {
            margin: 12px 0;
            font-size: 17px;
            color: #d0c0e0;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            transition: all 0.3s ease;
        }
        .task .icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .task .label { flex: 1; }
        .task .status {
            font-size: 13px;
            color: #888;
            min-width: 80px;
            text-align: right;
        }
        .task.loading .status { color: #ffb347; animation: pulse 1s infinite; }
        .task.done { color: #77dd77; }
        .task.done .status { color: #77dd77; }
        .task.error { color: #ff6b6b; }
        .task.error .status { color: #ff6b6b; }
        .task.instant { color: #77dd77; }
        .task.instant .status { color: #77dd77; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .spinner {
            border: 2px solid #5a3e7a;
            border-top: 2px solid #ffb347;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-box {
            background: rgba(255, 80, 80, 0.15);
            border: 1px solid #ff6b6b;
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
        }
        .error-text {
            color: #f5e6b8;
            font-size: 17px;
            line-height: 1.6;
        }
        .error-text code {
            background: rgba(255, 179, 71, 0.15);
            color: #ffe0a3;
            padding: 4px 12px;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 1.1em;
            border: 1px solid rgba(255, 179, 71, 0.3);
            display: inline-block;
        }
        .info-text {
            font-size: 14px;
            color: #a090b0;
            margin-top: 15px;
        }
        .footer-image {
            margin-top: 20px;
            max-width: 100%;
            display: block;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-cookie { background: #2d8a4e; color: #fff; }
        .badge-check { background: #ffb347; color: #1e1230; }
        .badge-loading { background: #5a3e7a; color: #fff; }
    </style>
</head>
<body>

<div class="access-wrapper">
    <div class="access-card" id="mainCard">
        <h1>Авторизация</h1>
        <div class="task-list">
            <div class="task" id="taskToken">
                <span class="icon">○</span>
                <span class="label">Проверка доступа</span>
                <span class="status">ожидание</span>
            </div>
            <div class="task" id="taskGuide">
                <span class="icon">○</span>
                <span class="label">Загрузка гайда</span>
                <span class="status">ожидание</span>
            </div>
        </div>
    </div>
</div>

<img class="footer-image" src="revival_1.png" alt="Revival Art">

<script>
    const BOT_API = 'https://revivalbot.onrender.com';
    const TOKEN_KEY = 'revival_token';
    const EXPIRES_KEY = 'revival_expires';

    const taskToken = document.getElementById('taskToken');
    const taskGuide = document.getElementById('taskGuide');

    function setTaskStatus(taskEl, status, statusText, extraClass = '') {
        taskEl.classList.remove('loading', 'done', 'error', 'instant');
        const icon = taskEl.querySelector('.icon');
        const statusSpan = taskEl.querySelector('.status');
        
        if (status === 'loading') {
            taskEl.classList.add('loading');
            icon.innerHTML = '<div class="spinner"></div>';
            statusSpan.textContent = statusText || 'загрузка...';
        } else if (status === 'done') {
            taskEl.classList.add('done');
            icon.innerHTML = '✅';
            statusSpan.textContent = statusText || 'готово';
        } else if (status === 'instant') {
            taskEl.classList.add('instant', 'done');
            icon.innerHTML = '✅';
            statusSpan.innerHTML = statusText || 'готово <span class="status-badge badge-cookie">⚡ куки</span>';
        } else if (status === 'error') {
            taskEl.classList.add('error');
            icon.innerHTML = '❌';
            statusSpan.textContent = statusText || 'ошибка';
        }
    }

    function showError(message, showGuideHint = false) {
        const mainCard = document.getElementById('mainCard');
        mainCard.innerHTML = `
            <h1>Доступ к гайду</h1>
            <div class="error-box">
                <p class="error-text">${message}</p>
                ${showGuideHint ? `
                    <p class="error-text" style="margin-top:10px;">Напишите в любом текстовом канале команду <code>/guide</code></p>
                    <p class="info-text">Бот выдаст вам персональную ссылку</p>
                ` : ''}
            </div>
        `;
    }

    // ============ РАБОТА С КУКАМИ ============
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    function setCookie(name, value, expiresTimestamp) {
        const date = new Date(expiresTimestamp * 1000);
        const secure = location.protocol === 'https:' ? '; Secure' : '';
        document.cookie = `${name}=${value}; expires=${date.toUTCString()}; path=/; SameSite=Lax${secure}`;
    }

    function deleteCookie(name) {
        document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
    }

    // ============ ПРОВЕРКА ТОКЕНА ИЗ КУК ============
    function checkTokenFromCookie() {
        const token = getCookie(TOKEN_KEY);
        const expires = getCookie(EXPIRES_KEY);
        
        if (!token || !expires) {
            return null;
        }
        
        const now = Math.floor(Date.now() / 1000);
        const expiresNum = parseInt(expires);
        
        if (expiresNum > now) {
            return token;
        } else {
            deleteCookie(TOKEN_KEY);
            deleteCookie(EXPIRES_KEY);
            return null;
        }
    }

    // ============ ЗАГРУЗКА ГАЙДА ============
    function renderGuide(html) {
        document.open();
        document.write(html);
        document.close();
    }

    // ============ ПОКАЗАТЬ ЗАГРУЗКУ ГАЙДА ============
    function showGuideLoading() {
        setTaskStatus(taskGuide, 'loading', 'загрузка...');
    }

    // ============ ОСНОВНАЯ ФУНКЦИЯ ============
    async function checkAccess() {
        const urlParams = new URLSearchParams(window.location.search);
        let tokenFromUrl = urlParams.get('key');
        let tokenFromCookie = checkTokenFromCookie();

        // 🚀 СНАЧАЛА ПРОВЕРЯЕМ КУКИ (БЕЗ ЗАПРОСА К БОТУ)
        if (tokenFromCookie) {
            console.log('⚡ Токен из кук валиден, загружаем гайд без проверки!');
            
            // ✅ Мгновенная авторизация по кукам
            setTaskStatus(taskToken, 'instant', 'доступ получен');
            setTaskStatus(taskGuide, 'loading', 'загрузка...');
            
            try {
                const response = await fetch(`${BOT_API}/get-guide?key=${encodeURIComponent(tokenFromCookie)}`);
                
                if (!response.ok) {
                    deleteCookie(TOKEN_KEY);
                    deleteCookie(EXPIRES_KEY);
                    throw new Error('Токен больше не активен');
                }
                
                const data = await response.json();
                
                if (data.html) {
                    if (data.expires_at) {
                        setCookie(TOKEN_KEY, tokenFromCookie, data.expires_at);
                        setCookie(EXPIRES_KEY, data.expires_at, data.expires_at);
                    }
                    
                    setTaskStatus(taskGuide, 'done', 'загружено');
                    renderGuide(data.html);
                    return;
                }
            } catch (error) {
                console.log('Ошибка при загрузке по кукам:', error);
                deleteCookie(TOKEN_KEY);
                deleteCookie(EXPIRES_KEY);
                tokenFromCookie = null;
            }
        }

        // ============================================
        // ЕСЛИ КУКИ НЕ РАБОТАЮТ - ПРОВЕРЯЕМ ТОКЕН ИЗ URL
        // ============================================
        
        if (!tokenFromUrl) {
            showError('❌ Токен не указан.', true);
            return;
        }

        setTaskStatus(taskToken, 'loading', 'проверка...');
        setTaskStatus(taskGuide, 'loading', 'загрузка...');

        try {
            const response = await fetch(`${BOT_API}/get-guide?key=${encodeURIComponent(tokenFromUrl)}`);

            if (!response.ok) {
                const errorText = await response.text();
                setTaskStatus(taskToken, 'error', 'отказ');
                setTaskStatus(taskGuide, 'error', 'отменено');
                localStorage.removeItem(TOKEN_KEY);
                showError(`❌ ${errorText || 'Доступ запрещён'}`, false);
                return;
            }

            const data = await response.json();

            if (data.maintenance) {
                showMaintenance(data.message);
                return;
            }

            if (!data.html) {
                throw new Error('Гайд не найден');
            }

            // ✅ ТОКЕН ВАЛИДЕН - СОХРАНЯЕМ В КУКИ
            if (data.expires_at) {
                setCookie(TOKEN_KEY, tokenFromUrl, data.expires_at);
                setCookie(EXPIRES_KEY, data.expires_at, data.expires_at);
                console.log(`✅ Токен сохранен в куки до ${new Date(data.expires_at * 1000).toLocaleString()}`);
            }

            setTaskStatus(taskToken, 'done', 'доступ получен');
            await new Promise(resolve => setTimeout(resolve, 200));
            
            renderGuide(data.html);

        } catch (error) {
            console.error('Ошибка:', error);
            setTaskStatus(taskToken, 'error', 'ошибка');
            setTaskStatus(taskGuide, 'error', 'не загружен');
            showError('⚠️ Ошибка соединения с сервером. Проверьте интернет.', false);
        }
    }

    // ============ ЗАГЛУШКА ДЛЯ ТЕХ. РАБОТ ============
    function showMaintenance(message) {
        const mainCard = document.getElementById('mainCard');
        mainCard.innerHTML = `
            <h1>🔧 Технические работы</h1>
            <div class="error-box" style="border-color: #ffb347; background: rgba(255, 179, 71, 0.1);">
                <p class="error-text" style="color: #ffb347; font-size: 20px;">⚙️ ${message}</p>
                <p class="info-text" style="margin-top: 15px;">Гайд временно недоступен. Мы обновляем контент!</p>
                <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                    <span style="background: rgba(255, 179, 71, 0.2); padding: 5px 15px; border-radius: 20px; color: #ffb347; font-size: 13px;">
                        ⏱️ ~15-30 минут
                    </span>
                </div>
                <button onclick="location.reload()" style="margin-top: 20px; background: #ffb347; border: none; color: #1e1230; padding: 10px 30px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: all 0.3s;">
                    🔄 Проверить снова
                </button>
            </div>
        `;
        setTaskStatus(taskToken, 'loading', 'режим обслуживания');
        setTaskStatus(taskGuide, 'loading', 'ожидание...');
    }

    // Запуск
    checkAccess();
</script>

</body>
</html>
